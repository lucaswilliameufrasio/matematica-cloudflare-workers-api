services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: matematica
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  valkey:
    image: valkey/valkey:8.1
    ports:
      - "6379:6379"
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/matematica?sslmode=disable
      REDIS_ADDR: valkey:6379
      HTTP_ADDR: :8080
      AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
